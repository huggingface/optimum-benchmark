name: Security Checks

on:
  push:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          if [ "$EVENT_NAME" == "push" ]; then
            echo "depth=$(($(jq length <<< $COMMITS)+2))" >> $GITHUB_ENV
            echo "branch=$REF" >> $GITHUB_ENV
          fi
          if [ "$EVENT_NAME" == "pull_request" ]; then
            echo "depth=$(($PR_COMMITS+2))" >> $GITHUB_ENV
            echo "branch=$PR_REF" >> $GITHUB_ENV
          fi
        env:
          REF: ${{ github.ref_name }}
          COMMITS: ${{ tojson(github.event.commits) }}
          EVENT_NAME: ${{ github.event_name }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{env.branch}}
          fetch-depth: ${{env.depth}}

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # main
